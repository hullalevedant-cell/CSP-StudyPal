<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Study Pal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<style>
:root{--mist:#eeebfb;--lilac:#cfc7f5;--peach:#ffd8c9;--mint:#cbeedf;--sky:#cfe4fa;--ink:#2a2650;--soft:#6b6790}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--mist);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.65}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0}

.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.8;pointer-events:none;animation:drift 22s ease-in-out infinite}
.b1{width:480px;height:480px;background:var(--lilac);top:-12%;left:-8%}
.b2{width:420px;height:420px;background:var(--peach);bottom:-12%;right:-6%;animation-duration:26s;animation-direction:reverse}
.b3{width:320px;height:320px;background:var(--mint);top:40%;left:42%;animation-duration:30s}
@keyframes drift{50%{transform:translate(50px,-40px)}}

.app{position:relative;height:100%;max-width:1280px;margin:0 auto;padding:0 32px 24px;display:flex;flex-direction:column}
header{padding:24px 0 14px}
h1{font-size:1.5rem}

.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px}
.chat{display:flex;flex-direction:column;min-height:0}
.feed{flex:1;overflow-y:auto;padding:4px 12px 24px 0;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin;scrollbar-color:var(--lilac) transparent}
.feed::-webkit-scrollbar{width:8px}
.feed::-webkit-scrollbar-thumb{background:var(--lilac);border-radius:8px}

.hero{margin:auto 0}
.hero h2{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.08;max-width:14ch}
.hero p{color:var(--soft);max-width:44ch;margin-top:16px;font-size:1.05rem}

.msg.user{align-self:flex-end;max-width:80%;background:var(--peach);padding:10px 18px;border-radius:22px 22px 6px 22px}
.msg.bot{max-width:min(100%,820px);background:rgba(255,255,255,.68);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);padding:8px 24px 18px;border-radius:22px 22px 22px 6px}
.msg.bot>*:first-child{margin-top:10px}
.msg.bot p{margin:.7em 0}
.msg.bot pre{overflow-x:auto}
.reading{color:var(--soft)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}

.board{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.85);border-radius:24px;padding:22px}
.board h3{font-size:1.1rem}
.hint{color:var(--soft);font-size:.85rem;margin:6px 0 0}
.notes{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.note{width:100%;padding:12px 16px;border-radius:12px;font-size:.8rem;line-height:1.45;cursor:grab;touch-action:none;user-select:none;box-shadow:0 8px 20px rgba(42,38,80,.12);transition:box-shadow .15s}
.note.drag{cursor:grabbing;z-index:10;box-shadow:0 18px 34px rgba(42,38,80,.22)}
.note strong{display:block;margin-bottom:4px;overflow-wrap:anywhere}
.note span{color:var(--soft);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.t0{background:var(--mint)}.t1{background:var(--sky)}.t2{background:var(--lilac)}

.composer{display:flex;gap:10px;padding-top:6px}
.composer input{flex:1;border:0;border-radius:999px;padding:16px 24px;font:inherit;color:var(--ink);background:rgba(255,255,255,.92);box-shadow:0 6px 24px rgba(42,38,80,.1)}
.composer button{border:0;border-radius:999px;padding:0 30px;font:inherit;font-weight:500;background:var(--ink);color:#fff;cursor:pointer}
.composer button:disabled{opacity:.45;cursor:default}
.composer :focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

@media(max-width:900px){
  .app{padding:0 16px 16px}
  .layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:14px}
  .board{max-height:30vh;overflow:auto;padding:14px 16px}
  .notes{flex-direction:row;flex-wrap:wrap;margin-top:12px}
  .note{width:calc(50% - 8px)}
  .msg.user{max-width:92%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="app">
  <header><h1>Study Pal</h1></header>
  <div class="layout">
    <section class="chat">
      <main class="feed" id="feed">
        <div class="hero" id="hero">
          <h2>What are you studying today?</h2>
          <p>Ask a question and I'll answer from your own notes, with the sources beside it.</p>
        </div>
      </main>
      <form class="composer" id="form">
        <input id="q" placeholder="Ask about your notes" aria-label="Your question" autocomplete="off" />
        <button id="go">Ask</button>
      </form>
    </section>
    <aside class="board">
      <h3>Sources</h3>
      <p class="hint" id="hint">Pages behind each answer land here. Drag them wherever you like.</p>
      <div class="notes" id="notes"></div>
    </aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
const feed = document.getElementById("feed"), form = document.getElementById("form"),
      input = document.getElementById("q"), go = document.getElementById("go"),
      notesEl = document.getElementById("notes"), hint = document.getElementById("hint");
let busy = false;

// Markdown + LaTeX: pull math out first so markdown doesn't mangle it
function render(text) {
  const math = [];
  const stash = (t, d) => `@@M${math.push({ t, d }) - 1}@@`;
  text = text
    .replace(/\\\[([\s\S]+?)\\\]|\$\$([\s\S]+?)\$\$/g, (_, a, b) => stash(a ?? b, true))
    .replace(/\\\(([\s\S]+?)\\\)|\$([^\n$]+?)\$/g, (_, a, b) => stash(a ?? b, false))
    .replace(/</g, "&lt;");
  return marked.parse(text).replace(/@@M(\d+)@@/g, (_, i) =>
    katex.renderToString(math[i].t, { displayMode: math[i].d, throwOnError: false }));
}

function add(role) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  feed.appendChild(el);
  return el;
}

function draggable(el) {
  let sx, sy, ox = 0, oy = 0;
  el.addEventListener("pointerdown", e => {
    el.setPointerCapture(e.pointerId);
    sx = e.clientX - ox; sy = e.clientY - oy;
    el.classList.add("drag"); el.style.rotate = "0deg";
  });
  el.addEventListener("pointermove", e => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    ox = e.clientX - sx; oy = e.clientY - sy;
    el.style.translate = `${ox}px ${oy}px`;
  });
  el.addEventListener("pointerup", () => el.classList.remove("drag"));
}

function showNotes(sources) {
  notesEl.innerHTML = "";
  if (!sources.length) { hint.textContent = "No sources matched this question."; return; }
  hint.textContent = "Pages behind this answer. Drag them wherever you like.";
  const tilts = [-2.5, 1.8, -1.2, 2.4, -1.8];
  sources.forEach((s, i) => {
    const n = document.createElement("div");
    n.className = "note t" + (i % 3);
    n.style.rotate = tilts[i % tilts.length] + "deg";
    const b = document.createElement("strong");
    b.textContent = `[${s.n}] ${s.source}`;
    const t = document.createElement("span");
    t.textContent = s.snippet.replace(/\s+/g, " ").trim() + "…";
    n.append(b, t);
    draggable(n);
    notesEl.appendChild(n);
  });
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || busy) return;
  input.value = ""; busy = true; go.disabled = true;
  document.getElementById("hero")?.remove();
  notesEl.innerHTML = ""; hint.textContent = "Finding the right pages…";
  add("user").textContent = q;
  const bot = add("bot");
  bot.innerHTML = '<span class="reading">Reading your notes…</span>';
  feed.scrollTop = feed.scrollHeight;

  let text = "";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const l of lines) {
        if (!l.trim()) continue;
        const m = JSON.parse(l);
        if (m.type === "sources") showNotes(m.data);
        else { text += m.data; bot.innerHTML = render(text); feed.scrollTop = feed.scrollHeight; }
      }
    }
  } catch {
    bot.textContent = "Can't reach the Study Pal server. Start it with: uvicorn app:app";
  }
  busy = false; go.disabled = false; input.focus();
  feed.scrollTop = feed.scrollHeight;
});
</script>
</body>
</html>
